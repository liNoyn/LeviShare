name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build LeviShare.sln -c Release
      - run: dotnet test tests/LeviShare.Tests -c Release --no-build

      # Tags like v0.1.0 build the release zip and publish it. If a release for the tag already
      # exists (for example one written by hand), the zip is attached to it instead.
      - name: Publish release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/publish.ps1
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $zip = (Get-ChildItem artifacts/*.zip).FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip --clobber
          } else {
            gh release create $env:TAG $zip --title "LeviShare $env:TAG" --notes "Download the zip below, unzip it and run LeviShare.exe. Usage: README.md / README_JP.md."
          }
          exit $LASTEXITCODE
