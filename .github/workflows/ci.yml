name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build LeviShare.sln -c Release
      - run: dotnet test tests/LeviShare.Tests -c Release --no-build

      # Tags like v0.1.0 build the release zip and attach it to a draft release.
      - name: Publish release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/publish.ps1
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts/*.zip).FullName --draft --title "LeviShare ${{ github.ref_name }}" --notes "See README for usage."
